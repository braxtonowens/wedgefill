[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wedgefill"
version = "0.1.0"
description = "Complete cryo-ET membrane segmentations where the missing wedge hid them"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy", "scipy", "torch"]

[project.optional-dependencies]
scripts = ["zarr>=3", "scikit-image", "matplotlib"]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
